# slf4j-simple configuration. Keys must carry the org.slf4j.simpleLogger. prefix; unprefixed keys are ignored.
# stdout carries data only, so all logging goes to stderr.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=warn
# The CLI deliberately ships without Conscrypt; silence the JDK TLS fallback warning.
org.slf4j.simpleLogger.log.io.github.twscrape4j.http.HttpClientFactory=error
