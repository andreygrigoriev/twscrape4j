# Never add --link-at-build-time or --initialize-at-build-time for io.github.twscrape4j:
# the CLI excludes sqlite-jdbc, jOOQ and Conscrypt, and relies on an incomplete classpath
# plus run-time class initialization (see docs/plans/20260924-cli-native-docker.md, key decision 4).
Args = --no-fallback \
       --static-nolibc \
       -march=compatibility \
       -H:+ReportExceptionStackTraces
