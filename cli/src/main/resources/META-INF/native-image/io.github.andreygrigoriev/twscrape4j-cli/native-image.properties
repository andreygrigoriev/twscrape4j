# Never add --link-at-build-time or --initialize-at-build-time for io.github.twscrape4j:
# the CLI excludes sqlite-jdbc, jOOQ and Conscrypt, and relies on an incomplete classpath
# plus run-time class initialization (see CLAUDE.md, "Native image configuration").
# --static-nolibc is Linux-only; cli/pom.xml adds it through the Linux-activated native-linux profile.
Args = --no-fallback \
       -march=compatibility \
       -H:+ReportExceptionStackTraces
